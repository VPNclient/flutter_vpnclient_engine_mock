name: vpnclient_engine
description: >
  Mock VPN Client Engine — real business logic (config validation, core/driver
  compatibility, per-platform capability matrix, subscription management with
  persistence) with a mocked native layer, for developing and QA-ing
  app/vpnclient.app-flutter without native permissions or a real server.
version: 0.1.0
homepage: https://github.com/VPNclient/flutter_vpn_engine

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  http: ^1.2.0
  meta: ^1.11.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
